name: security-course-ci

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "security-course/**"
      - ".github/workflows/security-course-ci.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "security-course/**"
      - ".github/workflows/security-course-ci.yml"

permissions:
  contents: read

concurrency:
  group: security-course-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: security-course/pyproject.toml

      - name: Install project and development tools
        run: python -m pip install -e "./security-course[dev]"

      - name: Lint
        working-directory: security-course
        run: ruff check src tests examples scripts

      - name: Check formatting
        working-directory: security-course
        run: ruff format --check src tests examples scripts

      - name: Run tests
        working-directory: security-course
        run: pytest

      - name: Validate chapter catalog
        working-directory: security-course
        run: python scripts/validate_catalog.py

      - name: Validate notebooks
        working-directory: security-course
        run: python scripts/validate_notebooks.py

      - name: Validate references
        working-directory: security-course
        run: python scripts/validate_references.py

      - name: Validate traceability
        working-directory: security-course
        run: python scripts/validate_traceability.py
